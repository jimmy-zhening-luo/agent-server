--- # PROD.main.yml
name: Azure App Service Deploy
on:
  push:
    branches: [main]
    
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Install Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Create and Start virtual environment and Install dependencies
        id: venv
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
      - name: Stage to Azure
        id: stage
        uses: actions/upload-artifact@v7
        with:
          name: python-app
          path: |
            .
            !antenv/
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Staged App
        id: download
        uses: actions/download-artifact@v8
        with:
          name: python-app
      - name: Authenticate to Azure
        id: auth
        uses: Azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9E2664135FDE42B4AC69262B0A1A8C88 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_24A7C6EE8BC54734AF026408BC72A476 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F3F98857127540A0996B9C162C3D8135 }}

      - name: "Deploy to Azure Web App"
        uses: Azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: "agent-server"
          slot-name: "Production"
...
